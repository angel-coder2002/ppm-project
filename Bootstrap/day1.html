  <div class="container-lg my-5">
    <h2>Basic Grid</h2>

    <div class="row">
      <div class="col-6">
        <div class="p-5 bg-primary text-light">col 1</div>

    <div class="row justify-content-between">
      <div class="col-md-3">
      <div class="p-5 bg-primary text-light">col 1</div>
     </div>
     <div class="col-md-3">
